[package]
name = "modbench"
version = "0.1.4"
description = "Lightweight Modbus TCP/RTU client with device map (.mbmap) support"
authors = ["nobrega8"]
license = "MIT"
repository = "https://github.com/nobrega8/modbench"
edition = "2024"
default-run = "modbench"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows
# (see https://github.com/rust-lang/cargo/issues/8519)
name = "modbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"] }
tokio-serial = "5.5"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "fs", "rt", "io-std", "io-util"] }
thiserror = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
clap = { version = "4", features = ["derive"] }
# Same TLS setup the updater already uses, so it adds no new crates
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp-server"] }
