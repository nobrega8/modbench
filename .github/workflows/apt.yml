name: APT repository

# Rebuilds the signed APT repository from the .deb files of the latest releases
# and publishes it on GitHub Pages with the website (site/), so `apt upgrade`
# picks up new versions. Both share one Pages site: a deploy replaces all of it.
# Runs after each release, when the website changes, or by hand.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "manual/screenshots/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the .deb of the last 5 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repo/pool/main
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 5 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName'); do
            # A release whose Linux build failed has no .deb: skip it
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.deb' -D repo/pool/main ||
              echo "No .deb in $tag"
          done
          ls -l repo/pool/main

      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build and sign the repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          ARCHES: amd64 arm64
        working-directory: repo
        run: |
          sudo apt-get install -y apt-utils
          # One index per architecture: APT on a Raspberry Pi (arm64) must
          # not see the amd64 package, and the other way round
          for arch in $ARCHES; do
            mkdir -p dists/stable/main/binary-$arch
            apt-ftparchive --arch "$arch" packages pool > dists/stable/main/binary-$arch/Packages
            gzip -k9 dists/stable/main/binary-$arch/Packages
            echo "$arch: $(grep -c '^Package:' dists/stable/main/binary-$arch/Packages || true) package(s)"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Modbench \
            -o APT::FTPArchive::Release::Label=Modbench \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="$ARCHES" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" "$@"; }
          sign --clearsign -o dists/stable/InRelease dists/stable/Release
          sign --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --armor --export > key.asc

      - name: Add the website
        run: site/build.sh repo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: repo

      - id: deploy
        uses: actions/deploy-pages@v5
