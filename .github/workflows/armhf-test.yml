name: armhf test (temporary)

on:
  push:
    branches: [ci/armhf-release]

jobs:
  probe:
    runs-on: ubuntu-22.04
    container: debian:bookworm
    steps:
      - run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential pkg-config patchelf file xz-utils gh
          dpkg --add-architecture armhf
          apt-get update
          try() { echo "=== $*"; apt-get -s install -y "$@" >/tmp/o 2>&1 && echo OK || tail -12 /tmp/o; }
          try gcc-arm-linux-gnueabihf libwebkit2gtk-4.1-dev:armhf
          try gcc-arm-linux-gnueabihf libwebkit2gtk-4.1-dev:armhf libudev-dev:armhf libssl-dev:armhf librsvg2-dev:armhf libayatana-appindicator3-dev:armhf
          try gcc-arm-linux-gnueabihf libwebkit2gtk-4.1-dev:armhf libgtk-3-dev:armhf
          try --no-install-recommends gcc-arm-linux-gnueabihf libwebkit2gtk-4.1-dev:armhf libgtk-3-dev:armhf libudev-dev:armhf libssl-dev:armhf librsvg2-dev:armhf libayatana-appindicator3-dev:armhf
