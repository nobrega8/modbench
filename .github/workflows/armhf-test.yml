name: armhf test (temporary)

on:
  push:
    branches: [ci/armhf-release]
  workflow_dispatch:

jobs:
  build-armhf:
    runs-on: ubuntu-22.04
    container: debian:bookworm
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - name: System deps
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential pkg-config patchelf file xz-utils gh
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y gcc-arm-linux-gnueabihf libwebkit2gtk-4.1-dev:armhf libgtk-3-dev:armhf \
            libayatana-appindicator3-dev:armhf librsvg2-dev:armhf libudev-dev:armhf libssl-dev:armhf

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the .deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target armv7-unknown-linux-gnueabihf --bundles deb

      - name: Show the result
        run: |
          ls -l src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb/
          dpkg-deb -I src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb/*.deb | head -20
          file src-tauri/target/armv7-unknown-linux-gnueabihf/release/modbench
