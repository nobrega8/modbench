name: CI

# What runs where:
# - the web checks (formatting, types, unit tests) run once, on Linux: they do
#   not depend on the system;
# - the Rust checks (clippy, tests) run on Windows, Linux and macOS, since the
#   app is built for all three;
# - a change that only touches documentation, the website or images does not
#   build the app.
# A new push to a branch cancels the run still going for it (see concurrency).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "manual/**"
      - "site/**"
      - "assets/**"
      - "LICENSE"
      - ".github/FUNDING.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "manual/**"
      - "site/**"
      - "assets/**"
      - "LICENSE"
      - ".github/FUNDING.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Branches only read the cache that main saved: saving one per branch
      # takes time and is rarely found again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # The page does not change with the system: checked once.
      - name: Web checks
        if: runner.os == 'Linux'
        run: |
          npm run format:check
          npm run check
          npm test

      # The Rust side needs the built page (tauri embeds it).
      - run: npm run build

      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
