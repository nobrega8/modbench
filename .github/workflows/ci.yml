name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Diagnose the macOS icon (temporary)
        if: runner.os == 'macOS'
        run: |
          set +e
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcrun actool --version --output-format human-readable-text
          # Exactly as tauri-bundler 2 runs it (bundle/macos/icon.rs)
          t=$(mktemp -d); cp -R src-tauri/icons/Modbench.icon "$t/Icon.icon"; mkdir "$t/out"
          actool "$t/Icon.icon" --compile "$t/out" --output-format human-readable-text             --notices --warnings --output-partial-info-plist "$t/out/assetcatalog_generated_info.plist"             --app-icon Icon --include-all-app-icons --accent-color AccentColor             --enable-on-demand-resources NO --development-region en --target-device mac             --minimum-deployment-target 26.0 --platform macosx; echo "actool exit $?"
          ls -la "$t/out"
          echo "=== without --accent-color"
          rm -rf "$t/out"; mkdir "$t/out"
          actool "$t/Icon.icon" --compile "$t/out" --output-format human-readable-text             --notices --warnings --output-partial-info-plist "$t/out/assetcatalog_generated_info.plist"             --app-icon Icon --include-all-app-icons             --enable-on-demand-resources NO --development-region en --target-device mac             --minimum-deployment-target 26.0 --platform macosx; echo "actool exit $?"
          which -a actool; ls -la "$t/out"

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
