name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Diagnose the macOS icon (temporary)
        if: runner.os == 'macOS'
        run: |
          set +e
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          a="--output-format human-readable-text --notices --warnings --app-icon Icon --include-all-app-icons --accent-color AccentColor --enable-on-demand-resources NO --development-region en --target-device mac --minimum-deployment-target 26.0 --platform macosx"
          for dir in "$RUNNER_TEMP/plain" "$RUNNER_TEMP/.hidden"; do
            echo "=== $dir"
            rm -rf "$dir"; mkdir -p "$dir/out"; cp -R src-tauri/icons/Modbench.icon "$dir/Icon.icon"
            actool "$dir/Icon.icon" --compile "$dir/out" --output-partial-info-plist "$dir/out/p.plist" $a
            echo "actool exit $?"
          done
          echo "=== .hidden with PNG layers"
          d="$RUNNER_TEMP/.hidden2"; rm -rf "$d"; mkdir -p "$d/out"; cp -R src-tauri/icons/Modbench.icon "$d/Icon.icon"
          for f in device arrows; do
            sips -s format png "$d/Icon.icon/Assets/$f.svg" --out "$d/Icon.icon/Assets/$f.png" >/dev/null && rm "$d/Icon.icon/Assets/$f.svg"
          done
          sed -i '' 's/\.svg"/.png"/g' "$d/Icon.icon/icon.json"
          ls "$d/Icon.icon/Assets"; grep image-name "$d/Icon.icon/icon.json"
          actool "$d/Icon.icon" --compile "$d/out" --output-partial-info-plist "$d/out/p.plist" $a
          echo "actool exit $?"

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
