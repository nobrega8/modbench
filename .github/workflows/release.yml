name: Release

# Push a tag like v0.2.0 to build signed installers for Windows, Linux and
# macOS and publish them, with the updater's latest.json, as a GitHub release.
# Each 0.X line has a name from .github/release-names.json (pioneers of
# electricity, in alphabetical order), which its fixes (0.X.1, ...) keep.
# The notes list the pull requests merged since the previous tag.
# The macOS app is one universal build (Apple Silicon and Intel), signed
# ad hoc: it has no Apple Developer ID, so Gatekeeper asks once on first open.
#
# To release one system only (e.g. a fix that only macOS needs), run this
# workflow by hand from the Actions tab: give the new tag and the system. The
# tag is created on the branch it runs on, and the notes say where the other
# systems' installers are. Its latest.json then lists that system only.
#
# The update banner in the app shows the notes of latest.json on one line, so
# they get a short summary instead of the release's Markdown: the `summary`
# given when run by hand, else the message of an annotated tag
# (git tag -a v0.3.0 -m "Charts · Simulator setups"), else the pull request
# titles joined with " · ".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "New tag, e.g. v0.2.1 (created on the branch this runs on)"
        required: true
      platforms:
        description: "Systems to build"
        type: choice
        options: [all, macos, windows, linux]
        default: all
      summary:
        description: "One line for the app's update banner (optional; the pull request titles otherwise)"
        required: false

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.notes.outputs.name }}
      body: ${{ steps.notes.outputs.body }}
      tag: ${{ steps.notes.outputs.tag }}
      matrix: ${{ steps.notes.outputs.matrix }}
      summary: ${{ steps.notes.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Name and notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          SUMMARY: ${{ inputs.summary }}
          DOWNLOAD: "Download the installer for your system: `-setup.exe` or `.msi` for Windows, `.AppImage` or `.deb` for Linux (`amd64`/`x86_64` for PCs, `arm64`/`aarch64` for the Raspberry Pi and other 64-bit ARM boards, `armhf` for the Raspberry Pi 4 and others on 32-bit Raspberry Pi OS), `.dmg` for macOS (Apple Silicon and Intel; the first time, right-click the app and choose Open). Installed copies update themselves from here."
          DOWNLOAD_MACOS: "Download the `.dmg` (Apple Silicon and Intel; the first time, right-click the app and choose Open). Installed copies update themselves from here."
          DOWNLOAD_WINDOWS: "Download the `-setup.exe` or the `.msi`. Installed copies update themselves from here."
          DOWNLOAD_LINUX: "Download the `.AppImage` or the `.deb` (`amd64`/`x86_64` for PCs, `arm64`/`aarch64` for 64-bit ARM, `armhf` for 32-bit Raspberry Pi OS). Installed copies update themselves from here."
        run: |
          tag="$TAG"
          line=$(echo "${tag#v}" | cut -d. -f1,2)
          codename=$(jq -r --arg l "$line" '.[$l] // empty' .github/release-names.json)
          name="Modbench $tag${codename:+ — $codename}"
          # A run by hand creates the tag later, on this commit
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then from="$tag^"; else from=HEAD; fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$from" 2>/dev/null || true)
          args=(-f tag_name="$tag")
          [ -n "$prev" ] && args+=(-f previous_tag_name="$prev")
          # Without the comment GitHub puts first
          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body | sed '/^<!--.*-->$/d')
          summary="$SUMMARY"
          if [ -z "$summary" ] && [ "$(git cat-file -t "refs/tags/$tag" 2>/dev/null)" = tag ]; then
            summary=$(git tag -l --format='%(contents:subject)' "$tag")
          fi
          if [ -z "$summary" ]; then
            summary=$(sed -n 's/^[*-] \(.*\)$/\1/p' <<<"$changes" | sed -E 's/ by @[^ ]+ in [^ ]+$//' | paste -sd'\t' | sed 's/\t/ · /g')
          fi
          # Linux is built twice: x86-64, and arm64 for the Raspberry Pi and
          # other 64-bit ARM boards (GitHub's arm64 runner, same Ubuntu)
          all='[{"platform":"windows","os":"windows-latest"},{"platform":"linux","os":"ubuntu-22.04"},{"platform":"linux","os":"ubuntu-22.04-arm"},{"platform":"macos","os":"macos-latest","args":"--target universal-apple-darwin"}]'
          matrix=$(jq -c --arg p "$PLATFORMS" 'map(select($p == "all" or .platform == $p))' <<<"$all")
          download="$DOWNLOAD"
          if [ "$PLATFORMS" != all ]; then
            case "$PLATFORMS" in
              macos) system=macOS; download="$DOWNLOAD_MACOS" ;;
              windows) system=Windows; download="$DOWNLOAD_WINDOWS" ;;
              linux) system=Linux; download="$DOWNLOAD_LINUX" ;;
            esac
            download="**$system only.** The other systems stay on [$prev](https://github.com/$GITHUB_REPOSITORY/releases/tag/$prev): get their installers there. $download"
          fi
          echo "$name"
          echo "$changes"
          echo "$matrix"
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "matrix=$matrix"
            echo "summary=$summary"
            echo "body<<NOTES_END"
            echo "$changes"
            echo
            echo "$download"
            echo "NOTES_END"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.notes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Xcode 26 compiles the Icon Composer icon (Liquid Glass) into
      # Assets.car; with an older Xcode the bundler keeps only the .icns.
      - name: Use Xcode 26
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcrun actool --version --output-format human-readable-text

      # The Liquid Glass icon (Icon Composer) is compiled here, not by the
      # bundler: actool throws inside tauri build ("attempt to insert nil
      # object") although the same command works on its own. The bundle takes
      # the Assets.car from here (tauri.macos.conf.json) and its name from
      # Info.plist.
      - name: Liquid Glass icon
        if: runner.os == 'macOS'
        run: |
          out=src-tauri/target/macos-icon
          mkdir -p "$out"
          xcrun actool src-tauri/icons/Modbench.icon --compile "$out" \
            --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist "$out/partial.plist" --app-icon Modbench \
            --include-all-app-icons --enable-on-demand-resources NO \
            --development-region en --target-device mac \
            --minimum-deployment-target 10.15 --platform macosx
          test -f "$out/Assets.car"

      # A universal build joins only the app's own binary for both
      # architectures; the bundle also holds modbench-cli, so join it first.
      - name: Universal modbench-cli
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          cargo build --release --bin modbench-cli --target aarch64-apple-darwin
          cargo build --release --bin modbench-cli --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/modbench-cli \
            target/aarch64-apple-darwin/release/modbench-cli \
            target/x86_64-apple-darwin/release/modbench-cli

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.notes.outputs.tag }}
          releaseName: ${{ needs.notes.outputs.name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # 32-bit Raspberry Pi OS (Raspberry Pi 4 and older): GitHub has no armhf
  # runner, so this is cross-built in Debian Bookworm, the release those
  # systems are based on. Tauri 2 needs WebKitGTK 4.1, which Debian Buster
  # does not have, so Buster cannot run it. Only the .deb is made: AppImage
  # tooling does not cross-build and the updater does not cover .deb files.
  build-armhf:
    needs: [notes, build]
    if: contains(fromJSON('["all","linux"]'), inputs.platforms || 'all')
    runs-on: ubuntu-22.04
    container: debian:bookworm
    env:
      TAG: ${{ needs.notes.outputs.tag }}
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_SYSROOT_DIR: /sysroot
      PKG_CONFIG_PATH: /sysroot/usr/lib/arm-linux-gnueabihf/pkgconfig:/sysroot/usr/share/pkgconfig
      RUSTFLAGS: -C link-arg=--sysroot=/sysroot
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      # WebKitGTK's -dev packages pull in gobject-introspection, which cannot
      # be installed for armhf next to the x86-64 one, so the armhf libraries
      # go into a sysroot of their own. Only the first debootstrap stage is
      # run, which downloads the packages; they are unpacked here, which is
      # all linking needs.
      - name: System deps
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential pkg-config patchelf file xz-utils gh \
            gcc-arm-linux-gnueabihf debootstrap symlinks
          debootstrap --foreign --arch=armhf --variant=minbase \
            --include=libwebkit2gtk-4.1-dev,libgtk-3-dev,libayatana-appindicator3-dev,librsvg2-dev,libudev-dev,libssl-dev,libc6-dev,libstdc++-12-dev \
            bookworm /sysroot http://deb.debian.org/debian
          for deb in /sysroot/var/cache/apt/archives/*.deb; do
            dpkg-deb --fsys-tarfile "$deb" | tar -x -C /sysroot --keep-directory-symlink
          done
          symlinks -cr /sysroot/usr/lib > /dev/null

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the .deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target armv7-unknown-linux-gnueabihf --bundles deb

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb/*.deb --clobber -R "$GITHUB_REPOSITORY"

  # The app's update banner shows latest.json's notes on one line: give it the
  # summary rather than the release's Markdown.
  updater-notes:
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Summary in latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.notes.outputs.tag }}
          SUMMARY: ${{ needs.notes.outputs.summary }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json
          jq --arg notes "$SUMMARY" '.notes = $notes' latest.json > notes.json
          mv notes.json latest.json
          gh release upload "$TAG" latest.json --clobber -R "$GITHUB_REPOSITORY"

      # The app reads the signatures from latest.json, not from the .sig
      # files, which only clutter the release's assets.
      - name: Remove the .sig files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.notes.outputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name | select(endswith(".sig"))' |
            while read -r name; do
              gh release delete-asset "$TAG" "$name" -y -R "$GITHUB_REPOSITORY"
            done
