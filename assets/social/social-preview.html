<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url("../../static/fonts/Inter-Variable.woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden;background:#0b0f14;font-family:Inter,sans-serif;color:#f5f5f5}
.bg{position:absolute;inset:0;background:
 radial-gradient(700px 420px at 15% 0%,rgba(34,211,107,.16),transparent 70%),
 radial-gradient(700px 480px at 100% 100%,rgba(33,150,243,.20),transparent 70%),
 linear-gradient(180deg,#10151c,#0b0f14)}
.text{position:absolute;left:80px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:22px}
.brand img{width:96px;height:96px}
h1{font-size:84px;font-weight:800;letter-spacing:-.035em}
p.tag{margin-top:30px;font-size:32px;line-height:1.25;font-weight:600;letter-spacing:-.015em;color:#e6e8eb}
p.tag b{color:#22d36b;font-weight:700}
.chips{margin-top:38px;display:flex;gap:36px;align-items:center}
.chips img{height:44px;width:auto;opacity:.85}
.shot{position:absolute;left:640px;top:96px;width:760px;border-radius:16px;overflow:hidden;
 box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 80px -10px rgba(0,0,0,.7),0 0 120px rgba(33,150,243,.18);
 transform:perspective(1800px) rotateY(-12deg) rotateX(3deg);transform-origin:left center}
.shot img{display:block;width:100%}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#22d36b,#2196f3)}
</style></head><body>
<div class="bg"></div>
<div class="text">
 <div class="brand"><img src="../icon.svg" alt=""><h1>Modbench</h1></div>
 <p class="tag">Modbus TCP, RTU and ASCII client. Read every register <b>by name</b>, already scaled.</p>
 <div class="chips"><img src="os/windows.svg" alt=""><img src="os/linux.svg" alt=""><img src="os/apple.svg" alt=""></div>
</div>
<div class="shot"><img src="../screenshots/device-map-dark.png" alt=""></div>
<div class="bar"></div>
</body></html>
